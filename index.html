<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonho da Sorte — Totem (modelo retrato)</title>
<!--
  ============================================================================
  MODELO DE REFERENCIA - TOTEM "SONHO DA SORTE"  (LAYOUT RETRATO)
  ALVO DE RENDERIZACAO: 720 x 1280 (RETRATO / 9:16)

  >>> LEIA ISTO, DEV <<<
  O totem roda num TV Box (MXQ Pro) via GeckoView. O motor renderiza num
  viewport de 720 x 1280 EM RETRATO (medido no aparelho real). A TV fica
  fisicamente montada NA VERTICAL. Desenhe o site em RETRATO (9:16), mais
  alto que largo. NAO desenhar em 1920x1080 nem 1280x720 landscape.

  O layout usa unidades relativas ancoradas em 100vw x 100vh e se adapta se
  a resolucao mudar (ex.: 1080x1920), desde que a PROPORCAO siga retrato 9:16.
  Substitua os PLACEHOLDERS (marcados com "DEV:") pelos seus componentes Vue.
  A ESTRUTURA e as PROPORCOES sao o que importa; cores/imagens sao ilustrativas.
  ============================================================================
-->
<style>
  :root{
    --bg-top:#3b2a8c; --bg-bottom:#241a5e;
    --panel:#2f2470; --panel-2:#372a86;
    --gold:#ffc531; --gold-soft:#ffd873;
    --white:#fff; --muted:#c9c3f0; --accent:#7b5cff;
    --radius: clamp(10px, 3.2vw, 26px);
    --pad: clamp(10px, 3.2vw, 26px);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%;
    background:var(--bg-bottom); overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    color:var(--white); -webkit-font-smoothing:antialiased;
  }
  /* PALCO RETRATO: tela toda, colunar, sem estourar 100vh */
  .stage{
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    padding:var(--pad); gap:clamp(8px,1.8vh,20px);
  }
  /* CABECALHO */
  .topbar{ display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; }
  .brand{ display:flex; align-items:center; gap:2.4vw; font-size:clamp(18px,4.6vw,34px); font-weight:700; }
  .brand .coin{
    width:clamp(28px,7vw,56px); aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--gold-soft),var(--gold) 70%);
    display:flex; align-items:center; justify-content:center;
    color:#5a3b00; font-weight:800; font-size:clamp(14px,3.4vw,26px);
  }
  .clock{ text-align:right; font-size:clamp(11px,2.2vw,17px); color:var(--muted); line-height:1.3; }
  .clock b{ display:block; font-size:clamp(13px,2.8vw,21px); color:var(--white); }
  /* NUMERO SORTEADO */
  .draw{ flex:0 0 auto; text-align:center; }
  .draw .sortnum{ font-size:clamp(13px,2.8vw,21px); color:var(--gold); font-weight:700; }
  .draw .label{ font-size:clamp(15px,3.4vw,25px); letter-spacing:.12em; margin:1vh 0; font-weight:700; }
  .balls{ display:flex; justify-content:center; gap:2.2vw; }
  .ball{
    width:clamp(46px,12.2vw,96px); aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#d9d3ff 75%);
    box-shadow:inset 0 -1vw 2vw rgba(90,60,200,.35);
    display:flex; align-items:center; justify-content:center;
    color:#2a1d6e; font-weight:800; font-size:clamp(18px,4.6vw,34px);
  }
  .ball.empty{ background:radial-gradient(circle at 35% 30%,#efeafc,#c9c1f2 75%); color:transparent; }
  /* CARDS */
  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border-radius:var(--radius); padding:clamp(12px,2.4vh,26px) var(--pad);
    box-shadow:0 1vh 3vh rgba(0,0,0,.25); flex:0 0 auto;
  }
  .prizes{ display:grid; grid-template-columns:repeat(5,1fr); gap:1.5vw; text-align:center; }
  .prize .icon{ font-size:clamp(22px,6.2vw,48px); line-height:1; }
  .prize .name{ font-size:clamp(12px,2.8vw,20px); font-weight:700; margin-top:.7vh; }
  .prize .val{ font-size:clamp(14px,3.2vw,24px); color:var(--gold); font-weight:800; margin-top:.5vh; }
  /* GANHADORES */
  .winners{ display:flex; align-items:center; gap:2.5vw; font-size:clamp(15px,3.4vw,25px); font-weight:700; }
  .winners .trophy{ font-size:clamp(22px,6.2vw,48px); }
  .winners b{ color:var(--gold); }
  /* PROXIMO SORTEIO */
  .next{
    margin-top:auto; background:var(--white); color:#2a1d6e;
    border-radius:var(--radius); padding:clamp(12px,2.2vh,24px) var(--pad);
    align-self:flex-start; min-width:58vw; flex:0 0 auto;
  }
  .next .eyebrow{ font-size:clamp(11px,2.2vw,17px); letter-spacing:.14em; color:#6b5fb0; font-weight:700; }
  .next .when{ font-size:clamp(18px,4.6vw,34px); font-weight:800; margin:.5vh 0 .8vh; }
  .timer{ display:flex; align-items:flex-end; gap:1.6vw; }
  .timer .num{ font-size:clamp(40px,11vw,86px); font-weight:800; line-height:.9; }
  .timer .sep{ font-size:clamp(32px,9vw,70px); font-weight:800; color:var(--accent); }
  .units{ display:flex; gap:6.5vw; font-size:clamp(11px,2.2vw,17px); color:#6b5fb0; margin-top:.6vh; font-weight:700; }
</style>
</head>
<body>
  <div class="stage">

    <!-- CABECALHO -->
    <header class="topbar">
      <div class="brand"><span class="coin">$</span><span>Sonho da Sorte</span></div>
      <!-- DEV: relogio/data reais -->
      <div class="clock">Terça-feira, 22/09<b>21:27</b></div>
    </header>

    <!-- NUMERO SORTEADO -->
    <section class="draw">
      <!-- DEV: numero do sorteio dinamico -->
      <div class="sortnum">🍀 Sorteio 114 &nbsp;·&nbsp; ⏱ 10:00</div>
      <div class="label">NÚMERO SORTEADO</div>
      <!-- DEV: v-for nas bolas do sorteio -->
      <div class="balls">
        <div class="ball">5</div>
        <div class="ball">0</div>
        <div class="ball empty">·</div>
        <div class="ball empty">·</div>
        <div class="ball empty">·</div>
        <div class="ball empty">·</div>
      </div>
    </section>

    <!-- PREMIOS -->
    <section class="card">
      <!-- DEV: v-for na lista de premios -->
      <div class="prizes">
        <div class="prize"><div class="icon">💰</div><div class="name">Sena</div><div class="val">398443</div></div>
        <div class="prize"><div class="icon">⭐</div><div class="name">Quina</div><div class="val">98443</div></div>
        <div class="prize"><div class="icon">🍀</div><div class="name">Quadra</div><div class="val">8443</div></div>
        <div class="prize"><div class="icon">🔸</div><div class="name">Trinca</div><div class="val">443</div></div>
        <div class="prize"><div class="icon">✌️</div><div class="name">Dupla</div><div class="val">43</div></div>
      </div>
    </section>

    <!-- GANHADORES -->
    <section class="card">
      <div class="winners">
        <span class="trophy">🏆</span>
        <!-- DEV: contagem dinamica -->
        <span><b>213</b> ganhadores neste sorteio</span>
      </div>
    </section>

    <!-- PROXIMO SORTEIO -->
    <section class="next">
      <div class="eyebrow">PRÓXIMO SORTEIO</div>
      <div class="when">Hoje às 11h</div>
      <!-- DEV: contador regressivo real -->
      <div class="timer">
        <span class="num">00</span><span class="sep">:</span>
        <span class="num">24</span><span class="sep">:</span>
        <span class="num">47</span>
      </div>
      <div class="units"><span>hr</span><span>min</span><span>seg</span></div>
    </section>

  </div>

  <script>
    /* DEV: apenas demonstracao do contador. Troque pela sua logica Vue.
       O que importa neste modelo e' a GEOMETRIA RETRATO, nao o JS. */
    (function(){
      var n = document.querySelectorAll('.timer .num');
      if(n.length<3) return;
      var h=0,m=24,s=47;
      setInterval(function(){
        if(s>0)s--; else {s=59; if(m>0)m--; else {m=59; if(h>0)h--;}}
        n[0].textContent=String(h).padStart(2,'0');
        n[1].textContent=String(m).padStart(2,'0');
        n[2].textContent=String(s).padStart(2,'0');
      },1000);
    })();
  </script>
</body>
</html>
